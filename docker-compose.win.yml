version: '3.8'

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: hr-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: hr_forms
    ports:
      - "5432:5432"
    volumes:
      - C:/app/dockerData/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hr-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - C:/app/dockerData/redis:/data

  backend:
    image: hr-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hr-backend
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      PORT: "8080"
      PG_DSN: "postgres://postgres:password123@postgres:5432/hr_forms?sslmode=disable"
      REDIS_HOST: "redis:6379"
      UPLOAD_DIR: "/app/data/uploads"
    ports:
      - "8080:8080"
    volumes:
      - C:/app/dockerData/config:/app/config:ro
      - C:/app/dockerData/uploads:/app/data/uploads

  nginx:
    image: nginx:alpine
    container_name: hr-nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - C:/app/dockerData/nginx/conf.d:/etc/nginx/conf.d
      - C:/app/dockerData/nginx/logs:/var/log/nginx
      - C:/app/dockerData/nginx/html:/usr/share/nginx/html
