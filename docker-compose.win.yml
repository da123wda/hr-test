version: '3.8'

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: hr-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: hr_forms
    ports:
      - "5432:5432"
    volumes:
      - C:/app/dockerData/postgres:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: hr-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - C:/app/dockerData/redis:/data

  backend:
    image: hr-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hr-backend
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    volumes:
      - ./backend/config:/app/config:ro
      - C:/app/dockerData/uploads:/app/data/uploads

  nginx:
    image: nginx:alpine
    container_name: hr-nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - C:/app/dockerData/nginx/logs:/var/log/nginx
      - ./frontend/dist:/usr/share/nginx/html:ro
